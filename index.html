<body>
  <div id="app">加载中…（若长时间空白，说明当前网络访问 CDN 失败，可直接到
    <a href="https://github.com/qlw088697-ui/codex-troubleshooting">GitHub 仓库</a>阅读）</div>
  <script>
    window.$docsify = {
      name: 'Codex 排障手册',
      repo: 'qlw088697-ui/codex-troubleshooting',
      coverpage: true,
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        placeholder: '搜索文档…',
        noData: '没有找到相关内容',
        depth: 3,
      },
      pagination: {
        previousText: '上一篇',
        nextText: '下一篇',
        crossChapter: true,
        crossChapterText: true,
      },
      plugins: [
        function (hook, vm) {
          hook.afterEach(function (html) {
            var file = vm.route.file || 'README.md';
            var url = 'https://github.com/qlw088697-ui/codex-troubleshooting/edit/main/' + file;
            return html + '\n\n----\n<a href="' + url + '" target="_blank" rel="noopener" style="font-size:13px;opacity:.65">✏️ 在 GitHub 上编辑此页 · 发现过时内容欢迎 PR</a>';
          });
        }
      ],
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
