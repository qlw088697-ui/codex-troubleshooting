name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scripts-and-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash 脚本语法检查
        run: |
          bash -n scripts/codex-doctor.sh
          bash -n scripts/check-links.sh
          bash -n scripts/check-consistency.sh

      - name: PowerShell 脚本解析检查
        shell: pwsh
        run: |
          $path = Join-Path $PWD 'scripts/codex-doctor.ps1'
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors -and $errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host ("Line {0}: {1}" -f $_.Extent.StartLineNumber, $_.Message) }
            exit 1
          }
          Write-Host 'codex-doctor.ps1 解析通过'

      - name: Node 脚本语法检查
        run: |
          node --check scripts/gen-releases.mjs
          for f in tool/*.mjs; do node --check "$f"; done

      - name: Markdown 相对链接检查
        run: bash scripts/check-links.sh

      - name: 结构一致性检查
        run: bash scripts/check-consistency.sh

      - name: codex-doctor CLI 冒烟测试
        run: |
          node tool/cli.mjs doctor --no-network --json > /tmp/doctor.json
          node -e "const d=require('/tmp/doctor.json'); if(!d.summary || !Array.isArray(d.results) || d.summary.fail > 0) process.exit(1); console.log('doctor smoke:', d.summary.pass, 'pass /', d.summary.warn, 'warn /', d.summary.fail, 'fail')"
